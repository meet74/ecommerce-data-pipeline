version: 2

models:
  - name: stg_shopify__orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_number
        tests: [not_null]
      - name: financial_status
        tests:
          - accepted_values:
              values: [pending, authorized, paid, partially_refunded, refunded, voided]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              values: [CAD, USD]
      - name: total_price
        tests: [not_null, non_negative]
  - name: stg_shopify__order_lines
    columns:
      - name: line_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_shopify__orders')
              field: order_id
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_shopify__products')
              field: product_id
      - name: quantity
        tests: [not_null, non_negative]
  - name: stg_shopify__customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_key
        tests: [not_null]
      - name: country
        tests:
          - accepted_values:
              values: [CA, US]
  - name: stg_shopify__products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: [active, archived, draft]
  - name: stg_shopify__refunds
    columns:
      - name: refund_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_shopify__orders')
              field: order_id
      - name: amount
        tests: [not_null, non_negative]
  - name: stg_stripe__charges
    columns:
      - name: charge_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: [succeeded, pending, failed]
      - name: currency
        tests:
          - accepted_values:
              values: [CAD, USD]
      - name: amount
        tests: [not_null, non_negative]
  - name: stg_stripe__refunds
    columns:
      - name: refund_id
        tests: [unique, not_null]
      - name: charge_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_stripe__charges')
              field: charge_id
  - name: stg_stripe__payouts
    columns:
      - name: payout_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: [paid, pending, in_transit, failed, canceled]
